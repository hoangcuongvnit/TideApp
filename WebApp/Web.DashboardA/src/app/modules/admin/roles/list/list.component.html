<div class="flex min-w-0 flex-auto flex-col role-detail">
    <div class="flex flex-0 flex-col dark:bg-transparent sm:justify-between">
        <!-- Header -->
        <div
            class="relative flex flex-0 flex-col border-b px-6 py-8 sm:flex-row sm:items-center sm:justify-between md:px-8">
            <!-- Loader -->
            @if (isLoading) {
            <div class="absolute inset-x-0 bottom-0">
                <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
            </div>
            }
            <div>
                <!-- Breadcrumbs -->
                <div class="flex flex-wrap items-center font-medium">
                    <div>
                        <a class="whitespace-nowrap text-primary-500">Role</a>
                    </div>
                    <div class="ml-1 flex items-center whitespace-nowrap">
                        <mat-icon class="text-secondary icon-size-5"
                            [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
                        <a class="ml-1 text-primary-500">List</a>
                    </div>
                </div>
                <!-- Title -->
                <div class="text-4xl font-extrabold tracking-tight">Roles</div>
            </div>
            <!-- Actions -->
            <div class="mt-6 flex shrink-0 items-center sm:ml-4 sm:mt-0">
                <!-- Search -->
                <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64" [subscriptSizing]="'dynamic'">
                    <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                    <input matInput [formControl]="searchInputControl" [autocomplete]="'off'"
                        [placeholder]="'Search roles'" />
                </mat-form-field>
                <!-- Add role button -->
                <button class="ml-4" mat-flat-button [color]="'primary'" [routerLink]="'/roles/create'">
                    <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                    <span class="ml-2 mr-1">Add</span>
                </button>
            </div>
        </div>

        <div class="flex-auto p-6">
            <ng-container *transloco="let t">
                <div class="flex flex-col rounded-2xl shadow">
                    <!-- Roles Table -->
                    <mat-table [dataSource]="roles" class="mat-elevation-z8" *ngIf="roles.length > 0">
                        <!-- Name Column -->
                        <ng-container matColumnDef="name">
                            <mat-header-cell *matHeaderCellDef> Name </mat-header-cell>
                            <mat-cell *matCellDef="let role"> {{ role.name }} </mat-cell>
                        </ng-container>

                        <!-- Description Column -->
                        <ng-container matColumnDef="description">
                            <mat-header-cell *matHeaderCellDef> Description </mat-header-cell>
                            <mat-cell *matCellDef="let role"> {{ role.description }} </mat-cell>
                        </ng-container>

                        <!-- Permissions Column -->
                        <ng-container matColumnDef="permissions">
                            <mat-header-cell *matHeaderCellDef> Permissions </mat-header-cell>
                            <mat-cell *matCellDef="let role">
                                {{ role.permissions.length }}
                            </mat-cell>
                        </ng-container>

                        <!-- Created At Column -->
                        <ng-container matColumnDef="createdAt">
                            <mat-header-cell *matHeaderCellDef> Created At </mat-header-cell>
                            <mat-cell *matCellDef="let role"> {{ role.createdAt | date: 'dd/MM/yyyy' }} </mat-cell>
                        </ng-container>

                        <!-- Actions Column -->
                        <ng-container matColumnDef="actions">
                            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
                            <mat-cell *matCellDef="let role">
                                <button mat-icon-button (click)="editRole(role)">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-icon-button color="warn" (click)="deleteRole(role.id)">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </mat-cell>
                        </ng-container>

                        <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
                        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
                    </mat-table>

                    <!-- No Roles Message -->
                    <div *ngIf="roles.length === 0" class="text-center text-gray-500 mt-4">
                        There are no roles.
                    </div>
                </div>
            </ng-container>
        </div>
    </div>
</div>
