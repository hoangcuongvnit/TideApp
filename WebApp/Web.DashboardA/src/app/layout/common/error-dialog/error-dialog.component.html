<div class="flex flex-col overflow-hidden rounded-2xl">
    <div class="flex flex-col p-6">
        <div class="mt-4 text-lg font-medium text-red-600 flex items-center">
            <mat-icon class="mr-2" color="warn">error</mat-icon>
            Error
        </div>
        <div class="text-secondary mt-0.5 line-clamp-2">
            <p>{{ data.message }}</p>
        </div>
    </div>
    <div class="mt-auto flex w-full flex-col">
        <div class="bg-gray-50 px-6 py-4 text-right dark:bg-transparent">
            <button mat-stroked-button (click)="redirect()">
                <span class="inline-flex items-center">
                    <span>Continue</span>
                    <mat-icon class="ml-1.5 icon-size-5" svgIcon="heroicons_solid:arrow-small-right"></mat-icon>
                </span>
            </button>
        </div>
    </div>
</div>
